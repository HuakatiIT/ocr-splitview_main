apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-frontend
  namespace: ocr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr-frontend
  template:
    metadata:
      labels:
        app: ocr-frontend
    spec:
      containers:
      - name: frontend
        image: your-registry/ocr-frontend:1.0.0 # replace with pushed image
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-frontend
  namespace: ocr
spec:
  selector:
    app: ocr-frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
