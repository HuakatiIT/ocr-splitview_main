apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ocr-ollama-pvc
  namespace: ocr
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-ollama
  namespace: ocr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr-ollama
  template:
    metadata:
      labels:
        app: ocr-ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        livenessProbe:
          exec:
            command:
            - ollama
            - list
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - ollama
            - list
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ocr-ollama-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-ollama
  namespace: ocr
spec:
  selector:
    app: ocr-ollama
  ports:
  - port: 11434
    targetPort: 11434
    protocol: TCP