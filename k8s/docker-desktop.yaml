apiVersion: v1
kind: Namespace
metadata:
  name: ocr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: ocr
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ocr-backend-pvc
  namespace: ocr
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ocr
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: ocr
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "super-secret-root"
            - name: MYSQL_DATABASE
              value: "ocr_users_db"
            - name: MYSQL_USER
              value: "ocr_user"
            - name: MYSQL_PASSWORD
              value: "super-strong-password"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: maildev
  namespace: ocr
spec:
  selector:
    app: maildev
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: web
      port: 1080
      targetPort: 1080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maildev
  namespace: ocr
spec:
  selector:
    matchLabels:
      app: maildev
  template:
    metadata:
      labels:
        app: maildev
    spec:
      containers:
        - name: maildev
          image: maildev/maildev:2.1.0
          args: ["--web", "1080", "--smtp", "1025"]
          ports:
            - containerPort: 1025
            - containerPort: 1080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocr-backend-config
  namespace: ocr
data:
  PORT: "3001"
  DB_PROVIDER: "mysql"
  SMTP_HOST: "maildev"
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASS: ""
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_USER: "ocr_user"
  MYSQL_PASS: "super-strong-password"
  MYSQL_DB: "ocr_users_db"
  ORACLE_HOST: "localhost"
  ORACLE_PORT: "1521"
  ORACLE_USER: "SYSTEM"
  ORACLE_PASS: "admin123"
  ORACLE_SERVICE: "FREEPDB1"
  TYPHOON_BASE_URL: "https://api.opentyphoon.ai/v1"
  CRAFT_URL: "http://craft-service:5000/detect"
  MOCK_OCR: "false"
  DATA_DIR: "/data"
---
apiVersion: v1
kind: Secret
metadata:
  name: ocr-backend-secret
  namespace: ocr
type: Opaque
stringData:
  MAIL_USER: ""
  MAIL_PASS: ""
  TYPHOON_API_KEY: "sk-N0BWvEJ7sMUxQrE9k4JIRL9ehdGZZRy7fP3gPtnie8QkZ8Kg"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-backend
  namespace: ocr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr-backend
  template:
    metadata:
      labels:
        app: ocr-backend
    spec:
      containers:
        - name: backend
          image: ocr-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: ocr-backend-config
            - secretRef:
                name: ocr-backend-secret
          volumeMounts:
            - name: backend-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/config
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/config
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: ocr-backend-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-backend
  namespace: ocr
spec:
  selector:
    app: ocr-backend
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-frontend
  namespace: ocr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr-frontend
  template:
    metadata:
      labels:
        app: ocr-frontend
    spec:
      containers:
        - name: frontend
          image: ocr-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_BASE_URL
              value: "http://ocr-backend:3001"
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-frontend
  namespace: ocr
spec:
  type: LoadBalancer
  selector:
    app: ocr-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ocr-frontend-ingress
  namespace: ocr
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: ocr-dd.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ocr-frontend
                port:
                  number: 80
