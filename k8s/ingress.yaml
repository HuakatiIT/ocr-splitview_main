apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ocr-app
  namespace: ocr
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: ocr.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ocr-frontend
            port:
              number: 80
